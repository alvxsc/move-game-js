<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Move Game TV</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;

      background: #08080b;
      color: white;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      overflow: hidden;
    }

    #receiver {
      width: 100%;
      height: 100%;

      display: flex;
      align-items: center;
      justify-content: center;

      text-align: center;
    }

    #content {
      display: flex;
      flex-direction: column;

      align-items: center;
      gap: 20px;
    }

    h1 {
      margin: 0;

      font-size: 64px;

      color: #a855f7;
    }

    p {
      margin: 0;

      font-size: 28px;

      color: rgba(255, 255, 255, 0.8);
    }
  </style>
</head>

<body>

  <main id="receiver">

    <div id="content">

      <h1>Move Game</h1>

      <p>Conectado à TV 🎮</p>

    </div>

  </main>

</body>
</html>
